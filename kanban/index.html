<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/yadalbaeb/kanban/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E1621">
  <title>Kanban CRM</title>
  <link rel="preload" href="assets/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; background: #0E1621; }
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease; }
    #loader div { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #223042; border-top-color: #5FA8E8; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader"><div></div></div>
  <script>
    // Прячем лоадер, как только Flutter нарисовал первый кадр
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
